name: build-apk

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Verify Commit Prefix
        run: |
          # Read the commit/PR message at RUNTIME from the event payload JSON.
          # Avoids injecting ${{ github.event.head_commit.message }} into the YAML,
          # which breaks parsing when the message has a multi-line body.
          COMMIT_MSG=$(jq -r '.head_commit.message // .pull_request.title // empty' "$GITHUB_EVENT_PATH")
          echo "Commit/PR: $COMMIT_MSG"

          # Block test: from merging to main
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ "$COMMIT_MSG" =~ ^test: ]]; then
              echo "::error::🚫 'test:' commits are build-only and CANNOT be merged into main."
              exit 1
            fi
          fi

          # Validate prefix format (scoped prefixes like wip(docker): allowed)
          if ! [[ "$COMMIT_MSG" =~ ^(test|wip|done|shell|fix|refactor|partial|blocked)(\([a-z0-9]+\))?: ]]; then
            echo "::warning::Commit prefix not recognized. Allowed prefixes: test wip done shell fix refactor partial blocked, optional scope also allowed e.g. wip(docker):"
          fi

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate android/ if missing
        run: |
          if [ ! -d "android" ]; then
            echo "android/ not found, generating via flutter create..."
            flutter create --platforms=android --project-name lanxi /tmp/lanxi_android_gen
            cp -r /tmp/lanxi_android_gen/android .
            rm -rf /tmp/lanxi_android_gen
          fi

      - name: Restore keystore (placeholder for real signing)
        run: |
          mkdir -p android/app/keystore
          echo "Using debug signing (test builds only)."

      - name: Flutter Analyze
        run: flutter analyze

      - name: Check for forbidden patterns
        run: |
          echo "::group::Anti-Cheat Checks"

          # Ban print()
          if grep -rn "print(" lib/ --include="*.dart" | grep -v "// print" | grep -v "debugPrint"; then
            echo "::error::print() found. Use appLogger instead."
            exit 1
          fi

          # Ban fake tests
          if grep -rn "expect(true, true)" test/; then
            echo "::error::Fake test detected: expect(true, true)"
            exit 1
          fi
          if grep -rn "expect(1, 1)" test/; then
            echo "::error::Fake test detected: expect(1, 1)"
            exit 1
          fi

          # Ban UnimplementedError in shipped code (except intentional placeholders)
          if grep -rn "UnimplementedError" lib/ --include="*.dart" | grep -v "server_source_factory.dart"; then
            echo "::error::UnimplementedError found in lib/. Must use FallbackException."
            exit 1
          fi

          # Ban single-quote $var in source files (Dart interpolation bug)
          if grep -rn "'[^']*\$_[a-zA-Z]" lib/ --include="*.dart"; then
            echo "::warning::Possible single-quote string with \$var found. Verify interpolation."
          fi

          echo "::endgroup::"

      - name: Flutter Test with Coverage
        run: flutter test --coverage

      - name: Check Coverage Threshold (70%)
        run: |
          if [ -f "coverage/lcov.info" ]; then
            COVERAGE=$(lcov --summary coverage/lcov.info 2>/dev/null | grep "lines" | awk '{print $2}' | sed 's/%//')
            echo "Coverage: ${COVERAGE}%"
            if (( $(echo "$COVERAGE < 70" | bc -l) )); then
              echo "::error::Coverage ${COVERAGE}% is below 70% threshold."
              exit 1
            fi
          else
            echo "::warning::No coverage report found."
          fi

      - name: Build APK (Release only for done:, Debug otherwise)
        run: |
          COMMIT_MSG=$(jq -r '.head_commit.message // .pull_request.title // empty' "$GITHUB_EVENT_PATH")
          if [[ "$COMMIT_MSG" =~ ^(done|wip)(:|\() ]]; then
            echo "Building RELEASE APK (done:)"
            flutter build apk --release
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          else
            echo "Building DEBUG APK"
            flutter build apk --debug
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          fi

          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanxi-apk
          path: ${{ env.APK_PATH }}
          retention-days: 7
